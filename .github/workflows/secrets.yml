name: Secret scan

on:
  push:
  pull_request:
  schedule:
    # Weekly sweep, so a secret committed and later reverted is still surfaced.
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Full history: a secret is still a secret after the commit that removed it.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
