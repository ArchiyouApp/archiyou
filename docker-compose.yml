# Production stack for the combined Archiyou server.
#   caddy    — TLS reverse proxy (auto HTTPS) → api
#   postgres — the script database (the single source of truth for scripts)
#   redis    — queue backend (password-protected; set REDIS_PASW in .env)
#   api      — combined API (/api editor backend + / library + /execute)
#   worker   — BullMQ execution worker (inert until .env opens an execution gate)
#
# Lives at the monorepo root because it deploys the whole monorepo, not just
# apps/server: it builds from the root context and serves apps/editor/dist.
# For local development see docker-compose.dev.yml (Redis only, everything
# else from source) or apps/server/docker-compose.yml (the whole stack in containers).
#
# Run (from the repo root):  pnpm docker:prod   —  or plain `docker compose up -d`

name: archiyou
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/data:/data
      - ./caddy/config:/config
      - ./caddy/logs:/logs
      # The built editor SPA. NOT committed to git — the api container builds it
      # on boot (apps/server/docker-entrypoint.sh), so on a first deploy this
      # directory is empty and caddy 404s until that build finishes. The empty
      # directory itself IS in git (apps/editor/dist/.gitkeep), which is what
      # stops docker from creating it here as root and leaving uid 1000 unable
      # to write into it.
      - ./apps/editor/dist:/srv/app:ro
    depends_on:
      - api
    networks:
      - archiyou-network

  # The script database. This is the instance developers also connect to (through an
  # ssh tunnel — see apps/server/README → Database), which is the whole point of moving
  # off a per-checkout SQLite file.
  #
  # ⚠️  Published on the LOOPBACK interface only. 5432 must never be reachable from the
  # internet: the ssh tunnel is the access path, and `127.0.0.1:` is what makes docker
  # refrain from opening the port in the host firewall. Do not "simplify" it to "5432:5432".
  postgres:
    image: postgres:17
    container_name: archiyou-postgres
    # No env_file: this container needs three variables, and handing it the whole .env
    # would put SERVER_JWT_SECRET and the Mailgun key inside the database container for
    # no reason. Compose still reads `.env` for the ${...} below.
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-archiyou}
      - POSTGRES_PASSWORD=${POSTGRES_PASW}
      - POSTGRES_DB=${POSTGRES_DB:-archiyou}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      # -U/-d explicitly: pg_isready otherwise defaults to the `postgres` role and
      # database, which this image does not create when POSTGRES_USER is set.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-archiyou} -d ${POSTGRES_DB:-archiyou}"]
      interval: 10s
      timeout: 3s
      retries: 5
    security_opt:
      - no-new-privileges:true
    networks:
      - archiyou-network

  redis:
    image: redis:7-alpine
    container_name: archiyou-redis
    volumes:
      - redis_data:/data
    env_file: .env
    command: redis-server --appendonly yes --requirepass ${REDIS_PASW}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - archiyou-network

  api:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: archiyou-api
    expose:
      - "4100"
    env_file: .env
    environment:
      - NODE_ENV=production
      - SERVER_PORT=4100
      - SERVER_REDIS_HOST=redis
      - SERVER_REDIS_PORT=6379
      - SERVER_REDIS_PASSWORD=${REDIS_PASW}
      # The script database. A postgres:// URL means the real server above; anything
      # else (or nothing) would fall back to in-process PGlite, which is a development
      # convenience and NOT what a deployment wants.
      - SERVER_DATABASE_URL=postgres://${POSTGRES_USER:-archiyou}:${POSTGRES_PASW}@postgres:5432/${POSTGRES_DB:-archiyou}
      # Read by the entrypoint's build step and inlined into the editor bundle
      # at build time (it cannot be changed afterwards without a rebuild). /api
      # matches the prefix caddy strips in the Caddyfile; set an absolute URL
      # only if you split the editor and API across hostnames.
      - SERVER_API_BASE_URL=${SERVER_API_BASE_URL:-/api}
      # Where the WORKER reaches this API, stamped into every execution job so a
      # server-side run can resolve $$import() assets, $$component('./name') from the
      # author's shared library, and gated module bundles. A service name on the
      # internal network, NOT a public URL — the worker never leaves this network.
      # Only the api needs it; the worker uses whatever arrives in the job.
      - SERVER_INTERNAL_API_URL=${SERVER_INTERNAL_API_URL:-http://api:4100}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      # The image ships no code (see apps/server/Dockerfile): the whole monorepo
      # checkout is mounted, so a deploy is `git pull` + `docker compose restart`.
      # The entrypoint also BUILDS into this mount (editor SPA, packages, script
      # modules) when sources are newer than its build stamp — which is why this
      # mount is read-write here and read-only on the worker.
      # It must be the repo ROOT, not just apps/server — apps/server is a workspace
      # package whose node_modules are symlinks into ../../node_modules/.pnpm, and
      # pnpm needs the root package.json + pnpm-workspace.yaml + lockfile.
      # The container WORKDIR is /archiyou/apps/server, so the remaining relative
      # paths (thumbnails, logs, backup scratch) resolve inside apps/server/data.
      - ./:/archiyou
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - archiyou-network

  # Executes user-authored scripts taken off the Redis queue.
  #
  # ⚠️  Running this container does NOT by itself enable server-side execution. The API
  # refuses to enqueue anything until one of the two gates in .env is open —
  # SERVER_EXECUTION_VALIDATED=1 (admin-validated scripts, callers may be anonymous) or
  # SERVER_EXECUTION_AUTHORS (trusted authors, authenticated). Both ship empty, so on a
  # default deployment this worker simply idles on a queue nothing writes to. The .env
  # settings are the switch; read SECURITY.md before opening either.
  #
  # The Runner has NO sandbox (see apps/server/src/config.ts → execution), so once you do
  # open it, treat this container as the one most likely to be compromised and give it as
  # little as possible:
  #   - NO env_file: an explicit allowlist of variables only, so a compromised script
  #     cannot read SERVER_JWT_SECRET (forging tokens for any user) or the Mailgun key
  #     out of process.env. config.jwtSecret is lazy, so the worker boots fine without
  #     it. Enforced in CI by apps/server/scripts/check-worker-env.py.
  #   - non-root (USER node in the Dockerfile), all capabilities dropped
  #   - cpu/memory/pid ceilings, because the in-process execution timeout cannot
  #     interrupt a tight synchronous loop (see ExecutionWorker.executeWithTimeout)
  worker:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: archiyou-worker
    # Runs from WORKDIR /archiyou/apps/server, so this is @archiyou/server's `worker`
    # script. From the workspace root the same line fails with
    # ERR_PNPM_RECURSIVE_EXEC_FIRST_FAIL ("Command \"worker\" not found").
    #
    # That script loads the mesh kernel from packages/meshup/dist (see
    # apps/server/tsconfig.runtime.json for why it cannot use the TypeScript source).
    # The entrypoint builds meshup before running this, and worker.ts checks for it and
    # says so plainly if it is missing.
    command: pnpm worker
    environment:
      - NODE_ENV=production
      - SERVER_REDIS_HOST=redis
      - SERVER_REDIS_PORT=6379
      - SERVER_REDIS_PASSWORD=${REDIS_PASW}
      - SERVER_EXECUTION_TIMEOUT_MS=${SERVER_EXECUTION_TIMEOUT_MS:-30000}
      - WORKER_ID=worker
    volumes:
      # Same code mount as api. Read-only: the worker runs untrusted user scripts and
      # has no reason to write to the checkout — it takes jobs from Redis and returns
      # results there, never touching the database. It is given no SERVER_DATABASE_URL
      # and no database credentials at all; CI asserts that (scripts/check-worker-env.py).
      - ./:/archiyou:ro
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 2g
    cpus: 1.5
    networks:
      - archiyou-network

volumes:
  redis_data:
    driver: local
  # The script database. Back it up (`pnpm admin:backup` takes a pg_dump); a lost
  # volume is a lost library.
  pg_data:
    driver: local

networks:
  archiyou-network:
    driver: bridge
