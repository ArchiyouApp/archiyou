[package]
name = "gdrr2bp-wasm"
version = "0.1.0"
edition = "2024"
description = "WebAssembly build of JeroenGar/gdrr-2bp (2D guillotine bin packing) with a single-threaded JSON solve() entry point"
license = "MIT"

# Standalone crate: do not get absorbed into a parent cargo workspace.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# wasm glue
wasm-bindgen = "0.2"
web-time = "1.1"
console_error_panic_hook = { version = "0.1", optional = true }

# vendored gdrr-2bp dependencies (mimalloc + ctrlc dropped: no wasm support)
# rand without its default features: no OS entropy (so no getrandom either), every run is seeded
# and uses util::rng::PortableRng. Only its traits and sampling are used.
rand = { version = "0.10", default-features = false, features = ["alloc"] }
indexmap = "2.7"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
once_cell = "1.12"
colored = "3.0"
svg = "0.18"
horrorshow = "0.8"
itertools = "0.14"
generational-arena = "0.2"
fxhash = "0.2"
ordered-float = "5.0"

[features]
default = ["console_error_panic_hook"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
