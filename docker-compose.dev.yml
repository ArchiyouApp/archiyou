# The two pieces of the stack you cannot just run from source: the script database
# and the queue backend.
#
# Everything else runs straight out of your working directory with tsx: no image is
# built, no code is copied, and an edit to apps/server or packages/core is picked up
# on the next run (or immediately, in `worker:dev` watch mode).
#
#     pnpm docker:dev         # start postgres + redis
#     pnpm dev                # editor + server, from source
#     pnpm dev:worker         # the worker, from source, in watch mode
#     pnpm docker:dev:down    # stop and remove them
#
# The split is deliberate: `docker:*` scripts run containers, `dev:*` scripts run code
# from your working tree. Nothing here is built into an image, so an edit to
# apps/server or packages/core is live on the next run.
#
# The other two files build images and are for rehearsing a deployment rather than for
# working: apps/server/docker-compose.yml runs api + redis + postgres + worker in
# containers, and docker-compose.yml is the production stack.
#
# ⚠️  Postgres here is OPTIONAL. With no `SERVER_DATABASE_URL` the server runs PGlite —
# Postgres compiled to WASM, in-process, same schema and migrations — so a fresh clone
# needs none of this. Start this file and point apps/server/.env at it when you want a
# real server: psql, pg_dump, several processes sharing one database.
#
#     SERVER_DATABASE_URL=postgres://archiyou:archiyou@localhost:5432/archiyou
#
# Its data lives in the checkout, in apps/server/data/pgdata (ignored by git), so it is
# where you can see it and survives `docker:dev:down`. The container runs as your own
# user, so those files stay yours rather than root's or the image's uid 999. `docker:dev`
# creates the directory first: one Docker made itself would be owned by root, and
# Postgres would not start. With a uid other than 1000, export UID and GID first.
#
# Both services are published on the loopback interface only. The credentials below are
# deliberately trivial and deliberately local: this database holds your scratch library,
# and nothing outside your machine can reach it.

name: archiyou-dev

services:
  postgres:
    image: postgres:17
    container_name: archiyou-dev-postgres
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-archiyou}
      - POSTGRES_PASSWORD=${POSTGRES_PASW:-archiyou}
      - POSTGRES_DB=${POSTGRES_DB:-archiyou}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./apps/server/data/pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-archiyou} -d ${POSTGRES_DB:-archiyou}"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Published on the standard 6379 so nothing needs configuring — the server defaults to
  # localhost:6379. If you already run Redis locally you do not need this service at all.
  # Appendonly is off: a dev queue is scratch, and losing it on restart is a feature.
  redis:
    image: redis:7-alpine
    container_name: archiyou-dev-redis
    ports:
      - "127.0.0.1:${SERVER_REDIS_PORT:-6379}:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 10
