<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Shape Picker — export</title>
<style>
  :root { font-family: var(--ay-font, system-ui, sans-serif); }
  body { margin: 0; padding: 12px; color: #1a1a1a; }
  h3 { margin: 0 0 8px; font-size: 13px; }
  dl { margin: 0 0 12px; display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: 12px; }
  dt { color: #6b7280; }
  dd { margin: 0; font-variant-numeric: tabular-nums; }
  .actions { display: flex; flex-direction: column; gap: 8px; }
  button { font: inherit; padding: 6px 10px; border: 1px solid #d1d5db; border-radius: 6px;
           background: #fff; cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: progress; }
  .msg { margin-top: 8px; font-size: 12px; color: #6b7280; }
</style>
</head>
<body>
  <h3>Model info</h3>
  <dl>
    <dt>Units</dt><dd id="units">—</dd>
    <dt>Shapes</dt><dd id="shapes">—</dd>
    <dt>Size</dt><dd id="bbox">—</dd>
  </dl>

  <h3>Export</h3>
  <div class="actions">
    <button id="glb">Download GLB</button>
    <button id="stl">Download STL</button>
  </div>
  <div class="msg" id="msg"></div>

<script>
  // Standalone guard so the file renders outside the editor.
  const archiyou = window.archiyou ?? {
    onResult(cb) { cb({ status: 'success', meta: { units: 'mm', numShapes: 1, bbox: [-50,-50,-50,50,50,50] } }); },
    async generate() { console.log('[export] generate (stub)'); return []; },
    download(name) { console.log('[export] download (stub):', name); },
  };

  const $ = (id) => document.getElementById(id);

  archiyou.onResult((r) => {
    const m = r?.meta ?? {};
    $('units').textContent = m.units ?? '—';
    $('shapes').textContent = m.numShapes ?? '—';
    if (Array.isArray(m.bbox) && m.bbox.length === 6) {
      const d = [m.bbox[3] - m.bbox[0], m.bbox[4] - m.bbox[1], m.bbox[5] - m.bbox[2]];
      $('bbox').textContent = d.map(n => Math.round(n)).join(' × ') + ' ' + (m.units ?? '');
    }
  });

  async function exportAs(selector, filename) {
    $('msg').textContent = 'Generating…';
    $('glb').disabled = $('stl').disabled = true;
    try {
      const outputs = await archiyou.generate([selector]);
      if (!outputs.length) { $('msg').textContent = 'Nothing to export.'; return; }
      archiyou.download(filename, outputs[0].data);
      $('msg').textContent = 'Downloaded ' + filename;
    } catch (e) {
      $('msg').textContent = 'Export failed: ' + (e && e.message ? e.message : e);
    } finally {
      $('glb').disabled = $('stl').disabled = false;
    }
  }

  $('glb').addEventListener('click', () => exportAs('default/model/glb', 'shape.glb'));
  $('stl').addEventListener('click', () => exportAs('default/model/stl', 'shape.stl'));
</script>
</body>
</html>
